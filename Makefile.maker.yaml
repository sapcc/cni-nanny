# Configuration file for <https://github.com/sapcc/go-makefile-maker>

metadata:
  url: https://github.com/sapcc/cni-nanny

dockerfile:
  enabled: false

golang:
  enableVendoring: false
  setGoModVersion: true

golangciLint:
  createConfig: true

reuse:
  annotations:
    - paths:
        - PROJECT
        - hack/boilerplate.go.txt
      SPDX-FileCopyrightText: SAP SE or an SAP affiliate company
      SPDX-License-Identifier: Apache-2.0

githubWorkflow:
  ci:
    enabled: true
    ignorePaths:
      - "**.md" # all Markdown files
  license:
    enabled: true
  securityChecks:
    enabled: true
  pushContainerToGhcr:
    enabled: true
    platforms: "linux/amd64"
    tagStrategy:
      - edge
      - latest
      - semver
      - sha

renovate:
  enabled: true
  assignees:
    - defo89
    - SchwarzM
    - xsen84
    - goerangudat
